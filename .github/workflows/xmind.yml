name: Update my XMind workspace
on:
  push:
    paths:
      - 'requests/request.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: xmind-${{ github.ref }}
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply request and refresh catalog
        run: python tools/cloud_request.py
      - name: Save result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 00_* 10_* 20_* 30_* 90_* CATALOG.md requests/results
          if git diff --cached --quiet; then
            echo 'No changes to save.'
            exit 0
          fi
          git commit -m 'Update XMind files and catalog'
          git push
